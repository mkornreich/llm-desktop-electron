<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; connect-src 'self';" />
<title>LLM Desktop — Settings</title>
<style>
  :root{
    --bg:#faf9f7; --panel:#fff; --ink:#1a1a19; --muted:#6b6a67; --line:#e5e3df;
    --accent:#c2603f; --accent-ink:#fff; --ok:#2f7d5d; --warn:#8a6d3b; --chip:#f0eee9;
  }
  @media (prefers-color-scheme: dark){
    :root{ --bg:#1a1a19; --panel:#242422; --ink:#eceae5; --muted:#a3a09a; --line:#35342f;
           --accent:#d97757; --accent-ink:#1a1a19; --ok:#6cc39a; --warn:#d3b273; --chip:#2e2d2a; }
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
       font:14px/1.5 ui-sans-serif,-apple-system,"Segoe UI",system-ui,sans-serif;}
  header{position:sticky;top:0;z-index:5;background:color-mix(in srgb,var(--bg) 88%,transparent);
         backdrop-filter:blur(10px);border-bottom:1px solid var(--line);padding:34px 26px 14px;}
  h1{margin:0 0 4px;font-size:17px;font-weight:650;letter-spacing:-.01em}
  .sub{color:var(--muted);font-size:12.5px}
  .status{display:flex;flex-wrap:wrap;gap:7px;margin-top:12px}
  .chip{background:var(--chip);border:1px solid var(--line);border-radius:999px;
        padding:3px 10px;font-size:11.5px;color:var(--muted);white-space:nowrap}
  .chip b{color:var(--ink);font-weight:600}
  .chip.on b{color:var(--ok)} .chip.off b{color:var(--warn)}
  main{padding:20px 26px 130px;max-width:900px}
  section{background:var(--panel);border:1px solid var(--line);border-radius:12px;
          margin:0 0 16px;overflow:hidden}
  .sh{display:flex;align-items:center;justify-content:space-between;gap:10px;
      padding:12px 16px;border-bottom:1px solid var(--line)}
  .sh h2{margin:0;font-size:13px;font-weight:650;letter-spacing:.01em}
  .file{font:11px ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--muted);
        background:var(--chip);border:1px solid var(--line);border-radius:6px;padding:2px 7px;
        }

  .row{display:grid;grid-template-columns:1fr auto;gap:14px;align-items:start;
       padding:14px 16px;border-bottom:1px solid var(--line)}
  .row:last-child{border-bottom:0}
  .row.changed{background:color-mix(in srgb,var(--accent) 7%,transparent)}
  label{font-weight:550;display:block;margin-bottom:3px}
  .key{font:10.5px ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--muted);margin-left:7px;font-weight:400}
  .help{color:var(--muted);font-size:12.5px;max-width:62ch}
  .ctl{display:flex;align-items:center;gap:8px;min-width:190px;justify-content:flex-end}
  input[type=text],input[type=number],select{
    background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:8px;
    padding:6px 9px;font:13px inherit;min-width:170px}
  input[type=number]{min-width:96px}
  input:focus,select:focus{outline:2px solid color-mix(in srgb,var(--accent) 45%,transparent);outline-offset:1px}
  .sw{position:relative;width:42px;height:24px;flex:0 0 auto}
  .sw input{position:absolute;opacity:0;width:100%;height:100%;margin:0;cursor:pointer}
  .sw span{position:absolute;inset:0;background:var(--line);border-radius:999px;transition:.15s}
  .sw span::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;
                  background:#fff;border-radius:50%;transition:.15s;box-shadow:0 1px 2px rgba(0,0,0,.25)}
  .sw input:checked + span{background:var(--accent)}
  .sw input:checked + span::after{transform:translateX(18px)}
  footer{position:fixed;left:0;right:0;bottom:0;background:color-mix(in srgb,var(--bg) 92%,transparent);
         backdrop-filter:blur(10px);border-top:1px solid var(--line);padding:12px 26px;
         display:flex;align-items:center;gap:10px}
  button{border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:9px;
         padding:8px 14px;font:13px inherit;font-weight:550;cursor:pointer}
  button:hover:not(:disabled){border-color:color-mix(in srgb,var(--ink) 26%,transparent)}
  button.primary{background:var(--accent);color:var(--accent-ink);border-color:transparent}
  button:disabled{opacity:.45;cursor:default}
  .grow{flex:1}
  .msg{font-size:12.5px;color:var(--muted)}
  .msg.ok{color:var(--ok)} .msg.warn{color:var(--warn)}
  .note{padding:11px 16px;font-size:12.5px;color:var(--muted);background:var(--chip);
        border-bottom:1px solid var(--line)}
</style>
</head>
<body>
<header>
  <h1>LLM Desktop settings</h1>
  <div class="sub">Edits the launcher's dot files. Comments in those files are preserved — only the value lines change.</div>
  <div class="status" id="status"></div>
</header>

<main id="form"><p class="msg">Loading…</p></main>

<footer>
  <span class="msg" id="msg"></span>
  <span class="grow"></span>
  <button id="revert" disabled>Revert</button>
  <button id="save" class="primary" disabled>Save</button>
  <button id="relaunch">Save &amp; restart app</button>
</footer>

<script>
const TOKEN = "__SETTINGS_TOKEN__";
const api = async (p, opts = {}) => {
  const r = await fetch(p + (p.includes("?") ? "&" : "?") + "t=" + TOKEN,
    { ...opts, headers: { "content-type": "application/json", "x-settings-token": TOKEN, ...(opts.headers || {}) } });
  if (!r.ok) throw new Error((await r.json().catch(() => ({}))).error || `HTTP ${r.status}`);
  return r.json();
};
// Same surface the Electron preload would have exposed, backed by the local API.
window.settings = {
  read:     ()        => api("/api/config"),
  write:    (updates) => api("/api/config", { method: "POST", body: JSON.stringify(updates) }),
  status:   ()        => api("/api/status"),
  relaunch: ()        => api("/api/relaunch", { method: "POST" }),
  reveal:   (file)    => Promise.resolve(),   // no Finder access from a page; the chip is a label here
};
const $ = (s) => document.querySelector(s);
let SCHEMA = [], CURRENT = {}, DRAFT = {};

const isBoolOn = (v) => v === "1" || v === "true";

function setMsg(text, cls) { const m = $("#msg"); m.textContent = text || ""; m.className = "msg" + (cls ? " " + cls : ""); }

function dirtyKeys() { return Object.keys(DRAFT).filter((k) => DRAFT[k] !== CURRENT[k].value); }

function refreshDirty() {
  const d = dirtyKeys();
  $("#save").disabled = d.length === 0;
  $("#revert").disabled = d.length === 0;
  for (const s of SCHEMA) {
    const row = document.getElementById("row-" + s.key);
    if (row) row.classList.toggle("changed", DRAFT[s.key] !== CURRENT[s.key].value);
  }
  setMsg(d.length ? `${d.length} unsaved change${d.length > 1 ? "s" : ""}` : "", d.length ? "warn" : "");
}

function control(s) {
  const v = DRAFT[s.key];
  if (s.type === "bool") {
    const w = document.createElement("label"); w.className = "sw";
    const i = document.createElement("input"); i.type = "checkbox"; i.checked = isBoolOn(v);
    i.setAttribute("aria-label", s.label);
    i.onchange = () => { DRAFT[s.key] = i.checked ? "1" : "0"; refreshDirty(); };
    const t = document.createElement("span");
    w.append(i, t); return w;
  }
  if (s.type === "enum") {
    const sel = document.createElement("select");
    for (const o of s.options) {
      const op = document.createElement("option");
      op.value = o; op.textContent = o === "" ? "(auto)" : o;
      if (o === v) op.selected = true;
      sel.append(op);
    }
    sel.onchange = () => { DRAFT[s.key] = sel.value; refreshDirty(); };
    return sel;
  }
  const i = document.createElement("input");
  i.type = s.type === "int" ? "number" : "text";
  i.value = v ?? ""; if (s.placeholder) i.placeholder = s.placeholder;
  if (s.suggestions) { i.setAttribute("list", "dl-" + s.key); }
  i.oninput = () => { DRAFT[s.key] = i.value.trim(); refreshDirty(); };
  if (!s.suggestions) return i;
  const wrap = document.createElement("span");
  const dl = document.createElement("datalist"); dl.id = "dl-" + s.key;
  for (const o of s.suggestions) { const op = document.createElement("option"); op.value = o; dl.append(op); }
  wrap.append(i, dl); return wrap;
}

function render() {
  const form = $("#form"); form.textContent = "";
  const groups = [...new Set(SCHEMA.map((s) => s.group))];
  for (const g of groups) {
    const items = SCHEMA.filter((s) => s.group === g);
    const sec = document.createElement("section");
    const head = document.createElement("div"); head.className = "sh";
    const h = document.createElement("h2"); h.textContent = g;
    const files = [...new Set(items.map((i) => i.file))];
    head.append(h);
    for (const f of files) {
      const b = document.createElement("span"); b.className = "file"; b.textContent = f;
      b.title = "Stored in " + f;
      head.append(b);
    }
    sec.append(head);
    if (g === "Provider") {
      const n = document.createElement("div"); n.className = "note";
      n.textContent = "Most settings are read when the app launches, so use “Save & restart app” to apply them.";
      sec.append(n);
    }
    for (const s of items) {
      const row = document.createElement("div"); row.className = "row"; row.id = "row-" + s.key;
      const left = document.createElement("div");
      const lab = document.createElement("label"); lab.textContent = s.label;
      const key = document.createElement("span"); key.className = "key"; key.textContent = s.key;
      lab.append(key);
      const help = document.createElement("div"); help.className = "help"; help.textContent = s.help || "";
      left.append(lab, help);
      const ctl = document.createElement("div"); ctl.className = "ctl"; ctl.append(control(s));
      row.append(left, ctl); sec.append(row);
    }
    form.append(sec);
  }
  refreshDirty();
}

function chip(text, value, state) {
  const c = document.createElement("span");
  c.className = "chip" + (state ? " " + state : "");
  c.innerHTML = "";
  c.append(document.createTextNode(text + " "));
  const b = document.createElement("b"); b.textContent = value; c.append(b);
  return c;
}

async function refreshStatus() {
  const el = $("#status");
  let st;
  try { st = await window.settings.status(); } catch { return; }
  el.textContent = "";
  el.append(chip("app", st.appRunning ? "running" : "not running", st.appRunning ? "on" : "off"));
  if (st.proxy) {
    el.append(chip("proxy", "up", "on"));
    el.append(chip("model", st.proxy.model || "?"));
    if (st.proxy.classifier_model) el.append(chip("classifier", st.proxy.classifier_model));
    el.append(chip("api", st.proxy.api || "?"));
  } else {
    el.append(chip("proxy", "not running", "off"));
  }
  if (st.usage && st.usage.total) {
    const t = st.usage.total;
    el.append(chip("tokens this proxy", `${(t.tokens || 0).toLocaleString()}`));
    if (t.reasoning_tokens) el.append(chip("of which reasoning", t.reasoning_tokens.toLocaleString()));
  }
}

async function load() {
  const { schema, values } = await window.settings.read();
  SCHEMA = schema; CURRENT = values;
  DRAFT = Object.fromEntries(Object.entries(values).map(([k, v]) => [k, v.value]));
  render();
}

async function save() {
  const d = dirtyKeys();
  if (!d.length) return {};
  const updates = Object.fromEntries(d.map((k) => [k, DRAFT[k]]));
  const res = await window.settings.write(updates);
  CURRENT = res.values;
  DRAFT = Object.fromEntries(Object.entries(res.values).map(([k, v]) => [k, v.value]));
  render();
  setMsg(`Saved to ${res.written.join(", ")}`, "ok");
  return res;
}

$("#save").onclick = () => save().catch((e) => setMsg("Save failed: " + e.message, "warn"));
$("#revert").onclick = () => {
  DRAFT = Object.fromEntries(Object.entries(CURRENT).map(([k, v]) => [k, v.value]));
  render(); setMsg("Reverted", "");
};
$("#relaunch").onclick = async () => {
  try {
    await save();
    setMsg("Restarting the app…", "");
    await window.settings.relaunch();
    setTimeout(refreshStatus, 6000);
    setMsg("App restarted with these settings", "ok");
  } catch (e) { setMsg("Restart failed: " + e.message, "warn"); }
};

load().catch((e) => { $("#form").textContent = "Failed to load settings: " + e.message; });
refreshStatus();
setInterval(refreshStatus, 5000);
</script>
</body>
</html>
