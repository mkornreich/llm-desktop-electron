<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; connect-src 'self';" />
<title>LLM Desktop — Settings</title>
<style>
  :root{
    --bg:#faf9f7; --panel:#fff; --ink:#1a1a19; --muted:#6b6a67; --line:#e5e3df;
    --accent:#c2603f; --accent-ink:#fff; --ok:#2f7d5d; --warn:#8a6d3b; --chip:#f0eee9;
  }
  @media (prefers-color-scheme: dark){
    :root{ --bg:#1a1a19; --panel:#242422; --ink:#eceae5; --muted:#a3a09a; --line:#35342f;
           --accent:#d97757; --accent-ink:#1a1a19; --ok:#6cc39a; --warn:#d3b273; --chip:#2e2d2a; }
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
       font:14px/1.5 ui-sans-serif,-apple-system,"Segoe UI",system-ui,sans-serif;}
  header{position:sticky;top:0;z-index:5;background:color-mix(in srgb,var(--bg) 88%,transparent);
         backdrop-filter:blur(10px);border-bottom:1px solid var(--line);padding:34px 26px 14px;}
  h1{margin:0 0 4px;font-size:17px;font-weight:650;letter-spacing:-.01em}
  .sub{color:var(--muted);font-size:12.5px}
  .status{display:flex;flex-wrap:wrap;gap:7px;margin-top:12px}
  .chip{background:var(--chip);border:1px solid var(--line);border-radius:999px;
        padding:3px 10px;font-size:11.5px;color:var(--muted);white-space:nowrap}
  .chip b{color:var(--ink);font-weight:600}
  .chip.on b{color:var(--ok)} .chip.off b{color:var(--warn)}
  .chip.warn{border-color:var(--warn)} .chip.warn b{color:var(--warn)}
  /* An OpenAI-only setting while the agent is on Anthropic. Dimmed and marked, never
     hidden or cleared: the value is still what applies when the provider goes back. */
  .row.inert{opacity:.55} .row.inert .ctl{filter:grayscale(1)}
  .inert-note{color:var(--warn);margin-top:4px}
  main{padding:20px 26px 130px;max-width:900px}
  section{background:var(--panel);border:1px solid var(--line);border-radius:12px;
          margin:0 0 16px;overflow:hidden}
  .sh{display:flex;align-items:center;justify-content:space-between;gap:10px;
      padding:12px 16px;border-bottom:1px solid var(--line)}
  .sh h2{margin:0;font-size:13px;font-weight:650;letter-spacing:.01em}
  .file{font:11px ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--muted);
        background:var(--chip);border:1px solid var(--line);border-radius:6px;padding:2px 7px;
        }

  .row{display:grid;grid-template-columns:1fr auto;gap:14px;align-items:start;
       padding:14px 16px;border-bottom:1px solid var(--line)}
  .row:last-child{border-bottom:0}
  .row.changed{background:color-mix(in srgb,var(--accent) 7%,transparent)}
  label{font-weight:550;display:block;margin-bottom:3px}
  .key{font:10.5px ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--muted);margin-left:7px;font-weight:400}
  .help{color:var(--muted);font-size:12.5px;max-width:62ch}
  .ctl{display:flex;align-items:center;gap:8px;min-width:190px;justify-content:flex-end}
  input[type=text],input[type=number],select{
    background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:8px;
    padding:6px 9px;font:13px inherit;min-width:170px}
  input[type=number]{min-width:96px}
  input:focus,select:focus{outline:2px solid color-mix(in srgb,var(--accent) 45%,transparent);outline-offset:1px}
  .sw{position:relative;width:42px;height:24px;flex:0 0 auto}
  .sw input{position:absolute;opacity:0;width:100%;height:100%;margin:0;cursor:pointer}
  .sw span{position:absolute;inset:0;background:var(--line);border-radius:999px;transition:.15s}
  .sw span::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;
                  background:#fff;border-radius:50%;transition:.15s;box-shadow:0 1px 2px rgba(0,0,0,.25)}
  .sw input:checked + span{background:var(--accent)}
  .sw input:checked + span::after{transform:translateX(18px)}
  footer{position:fixed;left:0;right:0;bottom:0;background:color-mix(in srgb,var(--bg) 92%,transparent);
         backdrop-filter:blur(10px);border-top:1px solid var(--line);padding:12px 26px;
         display:flex;align-items:center;gap:10px}
  button{border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:9px;
         padding:8px 14px;font:13px inherit;font-weight:550;cursor:pointer}
  button:hover:not(:disabled){border-color:color-mix(in srgb,var(--ink) 26%,transparent)}
  button.primary{background:var(--accent);color:var(--accent-ink);border-color:transparent}
  button:disabled{opacity:.45;cursor:default}
  .grow{flex:1}
  .msg{font-size:12.5px;color:var(--muted)}
  .msg.ok{color:var(--ok)} .msg.warn{color:var(--warn)}
  .note{padding:11px 16px;font-size:12.5px;color:var(--muted);background:var(--chip);
        border-bottom:1px solid var(--line)}
</style>
</head>
<body>
<header>
  <h1>LLM Desktop settings</h1>
  <div class="sub">Edits the launcher's dot files. Comments in those files are preserved — only the value lines change.</div>
  <div class="status" id="status"></div>
</header>

<main id="form"><p class="msg">Loading…</p></main>

<footer>
  <span class="msg" id="msg"></span>
  <span class="grow"></span>
  <button id="revert" disabled>Revert</button>
  <button id="save" class="primary" disabled>Save</button>
  <button id="relaunch">Save &amp; restart app</button>
</footer>

<script>
const TOKEN = "__SETTINGS_TOKEN__";
const api = async (p, opts = {}) => {
  const r = await fetch(p + (p.includes("?") ? "&" : "?") + "t=" + TOKEN,
    { ...opts, headers: { "content-type": "application/json", "x-settings-token": TOKEN, ...(opts.headers || {}) } });
  if (!r.ok) throw new Error((await r.json().catch(() => ({}))).error || `HTTP ${r.status}`);
  return r.json();
};
// Same surface the Electron preload would have exposed, backed by the local API.
window.settings = {
  read:     ()        => api("/api/config"),
  write:    (updates) => api("/api/config", { method: "POST", body: JSON.stringify(updates) }),
  status:   ()        => api("/api/status"),
  provenance: ()      => api("/api/provenance?limit=200"),
  relaunch: ()        => api("/api/relaunch", { method: "POST" }),
  ollamaModels: ()    => api("/api/ollama-models"),
  reveal:   (file)    => Promise.resolve(),   // no Finder access from a page; the chip is a label here
};
const $ = (s) => document.querySelector(s);
let SCHEMA = [], CURRENT = {}, DRAFT = {};
let OLLAMA_MODELS = [], LOCAL_MODEL_FILE = {};
// The context a given local model launches with: its CONTEXT_<model> line, else the file default.
const modelCtx = (m) => LOCAL_MODEL_FILE["CONTEXT_" + (m || "")] ?? LOCAL_MODEL_FILE.OLLAMA_CONTEXT_LENGTH ?? "32768";

const isBoolOn = (v) => v === "1" || v === "true";

function setMsg(text, cls) { const m = $("#msg"); m.textContent = text || ""; m.className = "msg" + (cls ? " " + cls : ""); }

function dirtyKeys() {
  return Object.keys(DRAFT).filter((k) => {
    // The context field is per-model: it is dirty against the SELECTED model's saved context.
    if (k === "LOCAL_CONTEXT") return DRAFT.LOCAL_CONTEXT !== modelCtx(DRAFT.LOCAL_MODEL);
    return CURRENT[k] && DRAFT[k] !== CURRENT[k].value;
  });
}

function refreshDirty() {
  const d = dirtyKeys(); const ds = new Set(d);
  $("#save").disabled = d.length === 0;
  $("#revert").disabled = d.length === 0;
  for (const s of SCHEMA) {
    const row = document.getElementById("row-" + s.key);
    if (row) row.classList.toggle("changed", ds.has(s.key));
  }
  setMsg(d.length ? `${d.length} unsaved change${d.length > 1 ? "s" : ""}` : "", d.length ? "warn" : "");
}

// Everything persisted in .openai-model is read only in OpenAI mode: run.sh exports those
// CLAUDE_CODE_* keys only for the proxy path, and several hold OpenAI model ids that Anthropic
// would reject outright. .provider, .privacy and .sync apply either way.
const OPENAI_ONLY = (s) => s.file === ".openai-model";
const LOCAL_ONLY = (s) => s.file === ".local-model";
// .openai-model applies in openai (and local) mode; .local-model only in local mode. Inert rows
// are dimmed and marked, never hidden or cleared — the value still applies when you switch back.
const isInert = (s) => (DRAFT.PROVIDER === "anthropic" && OPENAI_ONLY(s)) || (DRAFT.PROVIDER !== "local" && LOCAL_ONLY(s));

function control(s) {
  const v = DRAFT[s.key];
  if (s.type === "enum" && s.key === "PROVIDER") {
    // Switching the provider changes which OTHER controls are in effect, so this one re-renders
    // rather than only recording the draft value.
    const sel = document.createElement("select");
    for (const o of s.options) {
      const op = document.createElement("option");
      op.value = o; op.textContent = o; if (o === v) op.selected = true;
      sel.append(op);
    }
    sel.onchange = () => { DRAFT[s.key] = sel.value; render(); };
    return sel;
  }
  if (s.type === "ollama") {
    // Model picker: a dropdown of installed Ollama models (+ the current value, so a model that is
    // set but not installed is not silently dropped). Picking one snaps the context field to that
    // model's context. Falls back to a text field when no models are found (Ollama not running).
    const cur = DRAFT[s.key] || "";
    const opts = [...new Set([...(cur ? [cur] : []), ...OLLAMA_MODELS])];
    if (!opts.length) {
      const i = document.createElement("input"); i.type = "text";
      i.value = cur; if (s.placeholder) i.placeholder = s.placeholder;
      i.onchange = () => { DRAFT[s.key] = i.value.trim(); DRAFT.LOCAL_CONTEXT = modelCtx(DRAFT[s.key]); render(); };
      return i;
    }
    const sel = document.createElement("select");
    for (const o of opts) {
      const op = document.createElement("option"); op.value = o; op.textContent = o;
      if (o === cur) op.selected = true; sel.append(op);
    }
    sel.onchange = () => { DRAFT[s.key] = sel.value; DRAFT.LOCAL_CONTEXT = modelCtx(sel.value); render(); };
    return sel;
  }
  if (s.type === "ollama-context") {
    const i = document.createElement("input"); i.type = "number";
    i.value = DRAFT[s.key] ?? modelCtx(DRAFT.LOCAL_MODEL);
    i.oninput = () => { DRAFT[s.key] = i.value.trim(); refreshDirty(); };
    return i;
  }
  if (s.type === "bool") {
    const w = document.createElement("label"); w.className = "sw";
    const i = document.createElement("input"); i.type = "checkbox"; i.checked = isBoolOn(v);
    i.setAttribute("aria-label", s.label);
    i.onchange = () => { DRAFT[s.key] = i.checked ? "1" : "0"; refreshDirty(); };
    const t = document.createElement("span");
    w.append(i, t); return w;
  }
  if (s.type === "enum") {
    const sel = document.createElement("select");
    for (const o of s.options) {
      const op = document.createElement("option");
      op.value = o; op.textContent = o === "" ? "(auto)" : o;
      if (o === v) op.selected = true;
      sel.append(op);
    }
    sel.onchange = () => { DRAFT[s.key] = sel.value; refreshDirty(); };
    return sel;
  }
  const i = document.createElement("input");
  i.type = s.type === "int" ? "number" : "text";
  i.value = v ?? ""; if (s.placeholder) i.placeholder = s.placeholder;
  if (s.suggestions) { i.setAttribute("list", "dl-" + s.key); }
  i.oninput = () => { DRAFT[s.key] = i.value.trim(); refreshDirty(); };
  if (!s.suggestions) return i;
  const wrap = document.createElement("span");
  const dl = document.createElement("datalist"); dl.id = "dl-" + s.key;
  for (const o of s.suggestions) { const op = document.createElement("option"); op.value = o; dl.append(op); }
  wrap.append(i, dl); return wrap;
}

function render() {
  const form = $("#form"); form.textContent = "";
  const groups = [...new Set(SCHEMA.map((s) => s.group))];
  for (const g of groups) {
    const items = SCHEMA.filter((s) => s.group === g);
    const sec = document.createElement("section");
    const head = document.createElement("div"); head.className = "sh";
    const h = document.createElement("h2"); h.textContent = g;
    const files = [...new Set(items.map((i) => i.file))];
    head.append(h);
    for (const f of files) {
      const b = document.createElement("span"); b.className = "file"; b.textContent = f;
      b.title = "Stored in " + f;
      head.append(b);
    }
    sec.append(head);
    if (g === "Provider") {
      const n = document.createElement("div"); n.className = "note";
      n.textContent = "Most settings are read when the app launches, so use “Save & restart app” to apply them.";
      sec.append(n);
    }
    for (const s of items) {
      const row = document.createElement("div"); row.className = "row"; row.id = "row-" + s.key;
      const left = document.createElement("div");
      const lab = document.createElement("label"); lab.textContent = s.label;
      const key = document.createElement("span"); key.className = "key"; key.textContent = s.fileKey || s.key;
      lab.append(key);
      const help = document.createElement("div"); help.className = "help"; help.textContent = s.help || "";
      left.append(lab, help);
      // In Anthropic mode the OpenAI-only settings are inert — run.sh does not export them, and
      // several hold OpenAI model ids that Anthropic would simply reject. They are marked, not
      // hidden and never cleared: the value is still what will be used the moment the provider
      // goes back to openai, and deleting it would lose a deliberate choice.
      if (isInert(s)) {
        row.classList.add("inert");
        const n = document.createElement("div"); n.className = "help inert-note";
        n.textContent = LOCAL_ONLY(s)
          ? "Not in effect: the agent is not set to local. Saved, and applied when you switch the provider to local."
          : "Not in effect: the agent is set to Anthropic. Saved, and applied again when you switch back to OpenAI.";
        left.append(n);
      }
      const ctl = document.createElement("div"); ctl.className = "ctl"; ctl.append(control(s));
      row.append(left, ctl); sec.append(row);
    }
    form.append(sec);
  }
  refreshDirty();
}

function chip(text, value, state) {
  const c = document.createElement("span");
  c.className = "chip" + (state ? " " + state : "");
  c.innerHTML = "";
  c.append(document.createTextNode(text + " "));
  const b = document.createElement("b"); b.textContent = value; c.append(b);
  return c;
}

async function refreshStatus() {
  const el = $("#status");
  let st;
  try { st = await window.settings.status(); } catch { return; }
  el.textContent = "";
  el.append(chip("app", st.appRunning ? "running" : "not running", st.appRunning ? "on" : "off"));

  // "agent provider", not "provider". Only the local agent is affected by this setting — the
  // chat window is always the remote claude.ai app talking to Anthropic — and calling it
  // "provider" made it read as though it switched the whole application.
  const cfg = st.configured || {};
  el.append(chip("agent provider", cfg.provider || "?", cfg.provider === "openai" ? "on" : ""));

  // CONFIGURED and ACTIVE are separate rows because they can legitimately differ, and the
  // window used to show only the files and present that as the live state. An edited-but-not-
  // restarted setting looked applied; a stale proxy looked healthy.
  if (cfg.provider === "openai") {
    const state = st.proxyState;
    if (state === "ours") {
      el.append(chip("proxy", "serving these settings", "on"));
      el.append(chip("model", st.proxy.model || "?"));
      if (st.proxy.classifier_model) el.append(chip("classifier", st.proxy.classifier_model));
      el.append(chip("api", st.proxy.api || "?"));
      if (st.proxy.inflight) el.append(chip("in flight", String(st.proxy.inflight)));
    } else if (state === "stale") {
      // The failure this exists to surface: a running proxy answering /health with the PREVIOUS
      // configuration. It looks healthy from every angle except this one.
      el.append(chip("proxy", "STALE — restart to apply", "warn"));
      el.append(chip("running", st.proxy ? `${st.proxy.model} (${st.proxy.configHash || "?"})` : "not answering", "warn"));
      el.append(chip("configured", `${cfg.model} (${cfg.configHash})`));
    } else if (state === "foreign") {
      el.append(chip("proxy", "PORT TAKEN by another process", "warn"));
      el.append(chip("detail", st.proxyStateReason || "", "warn"));
    } else {
      el.append(chip("proxy", "not running", "off"));
      el.append(chip("configured", `${cfg.model} (${cfg.api})`));
    }
  } else {
    // Anthropic mode has no proxy by design, so "not running" is the correct state rather than a
    // fault. Saying nothing here made a correct configuration look broken.
    el.append(chip("proxy", "not used in anthropic mode", ""));
  }

  // A launch-time environment override resolves to the same value as a saved one, so without
  // this the window would report a temporary override as the persisted configuration.
  if (cfg.envOverrides?.length)
    el.append(chip("env override", cfg.envOverrides.join(", "), "warn"));
  for (const e of st.validation?.errors || []) el.append(chip("config error", e, "warn"));

  // Which model actually answered. The session's own stored `model` is what the CLIENT selected,
  // which in OpenAI mode is never what answered — so a count of sessions whose recorded provider
  // differs from the configured one is the only honest way to see it from here.
  try {
    const p = await window.settings.provenance();
    const n = p.sessions.length;
    if (n) {
      el.append(chip("sessions recorded", String(n)));
      const mixed = p.sessions.filter((s) => s.crossProvider).length;
      if (mixed) el.append(chip("cross-provider sessions", String(mixed), "warn"));
      const stale = p.sessions.filter((s) => s.staleForCurrentProvider).length;
      if (stale) el.append(chip("answered by another provider", String(stale), "warn"));
      const last = p.sessions[0];
      if (last?.resolvedModel) el.append(chip("last answered by", last.resolvedModel));
    }
  } catch { /* provenance is a diagnostic; never let it break the status line */ }
  if (st.usage && st.usage.total) {
    const t = st.usage.total;
    el.append(chip("tokens this proxy", `${(t.tokens || 0).toLocaleString()}`));
    if (t.reasoning_tokens) el.append(chip("of which reasoning", t.reasoning_tokens.toLocaleString()));
  }
}

async function load() {
  const res = await window.settings.read();
  SCHEMA = res.schema; CURRENT = res.values; LOCAL_MODEL_FILE = res.localModel || {};
  DRAFT = Object.fromEntries(Object.entries(res.values).map(([k, v]) => [k, v.value]));
  DRAFT.LOCAL_CONTEXT = modelCtx(DRAFT.LOCAL_MODEL);
  render();
  // Installed-model list is a best-effort enhancement; a missing Ollama must not block the form.
  try { OLLAMA_MODELS = (await window.settings.ollamaModels()).models || []; render(); } catch { /* no Ollama */ }
}

async function save() {
  const d = dirtyKeys();
  if (!d.length) return {};
  const updates = {};
  for (const k of d) {
    // The per-model context saves as CONTEXT_<selected model>, not a fixed key.
    if (k === "LOCAL_CONTEXT") { if (DRAFT.LOCAL_MODEL) updates["CONTEXT_" + DRAFT.LOCAL_MODEL] = DRAFT.LOCAL_CONTEXT; }
    else updates[k] = DRAFT[k];
  }
  const res = await window.settings.write(updates);
  CURRENT = res.values; LOCAL_MODEL_FILE = res.localModel || LOCAL_MODEL_FILE;
  DRAFT = Object.fromEntries(Object.entries(res.values).map(([k, v]) => [k, v.value]));
  DRAFT.LOCAL_CONTEXT = modelCtx(DRAFT.LOCAL_MODEL);
  render();
  setMsg(`Saved to ${res.written.join(", ")}`, "ok");
  return res;
}

$("#save").onclick = () => save().catch((e) => setMsg("Save failed: " + e.message, "warn"));
$("#revert").onclick = () => {
  DRAFT = Object.fromEntries(Object.entries(CURRENT).map(([k, v]) => [k, v.value]));
  DRAFT.LOCAL_CONTEXT = modelCtx(DRAFT.LOCAL_MODEL);
  render(); setMsg("Reverted", "");
};
$("#relaunch").onclick = async () => {
  const btn = $("#relaunch");
  try {
    await save();
    // Warn before discarding work. A turn can be minutes of real work and the old restart threw
    // it away silently; the count comes from the proxy, so it is what is actually in flight
    // rather than a guess.
    let st = null;
    try { st = await window.settings.status(); } catch { /* status is best-effort here */ }
    const busy = st?.proxy?.inflight || 0;
    if (busy && !confirm(
        `${busy} request${busy > 1 ? "s" : ""} ${busy > 1 ? "are" : "is"} still being answered. ` +
        `Restarting now will interrupt ${busy > 1 ? "them" : "it"} and that work will be lost.\n\n` +
        `Restart anyway?`)) {
      setMsg("Restart cancelled", "");
      return;
    }
    btn.disabled = true;
    setMsg("Stopping the app, then the proxy…", "");
    // The server now performs the whole sequence and VERIFIES the result, so this reports what
    // actually happened instead of announcing success the moment the request returned.
    const r = await window.settings.relaunch();
    await refreshStatus();
    if (r.error) setMsg(r.error, "warn");
    else if (r.verified === false) setMsg("Launched, but the new settings are not serving yet", "warn");
    else setMsg(`Restarted — ${r.model || r.verified || "running"}`, "ok");
  } catch (e) { setMsg("Restart failed: " + e.message, "warn"); }
  finally { btn.disabled = false; }
};

load().catch((e) => { $("#form").textContent = "Failed to load settings: " + e.message; });
refreshStatus();
setInterval(refreshStatus, 5000);

// The server is a plain local process with no handle on this window, so it can't tell when the
// window closes. Ping it so it knows we are still here; when the pings stop it shuts itself down
// instead of lingering. The pagehide beacon just makes that shutdown quicker than the timeout.
const heartbeat = () => fetch("/api/heartbeat?t=" + TOKEN, { headers: { "x-settings-token": TOKEN } }).catch(() => {});
heartbeat();
setInterval(heartbeat, 2000);
addEventListener("pagehide", () => { try { navigator.sendBeacon("/api/close?t=" + TOKEN); } catch (e) {} });
</script>
</body>
</html>
